upstream nextjs_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- Канонический хост (apex) ---
server {
    listen 443 ssl;
    server_name master-na-dom.online;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/master-na-dom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/master-na-dom.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Безопасность
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Сжатие текстовых ресурсов (по умолчанию nginx жмёт только text/html)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml application/rss+xml image/svg+xml font/woff2;

    # Иммутабельная статика Next — длинный кэш на границе nginx
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/health {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

# --- www и доступ по IP → 301 на apex (устраняем дубли хоста) ---
server {
    listen 443 ssl;
    server_name www.master-na-dom.online 45.130.43.157;

    ssl_certificate /etc/letsencrypt/live/master-na-dom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/master-na-dom.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://master-na-dom.online$request_uri;
}

# --- HTTP → HTTPS apex ---
server {
    listen 80;
    server_name master-na-dom.online www.master-na-dom.online 45.130.43.157;
    return 301 https://master-na-dom.online$request_uri;
}
